<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Películas{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/icono.png' %}?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="d-flex gap-2 my-2">
            <a href="{% url 'home:home' %}" class="btn btn-primary">Home</a>
            <a href="{% url 'genero:terror' %}" class="btn btn-danger">Terror</a>
            <a href="{% url 'genero:crimen' %}" class="btn btn-dark">Crimen</a>
            <a href="{% url 'genero:comedia' %}" class="btn btn-warning">Comedia</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; Creado por: Marian Paraguan y Jessica Pacheco - 2026</p>
    </footer>
</body>
</html>
