<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Películas{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/icono.png' %}?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <nav>
            <ul>
                <li id="m1"><a href="{% url 'home:home' %}">Home</a></li>
                <li id="m2"><a class="nav-link" href="{% url 'genero:terror' %}">Terror</a></li>
                <li id="m3"><a class="nav-link" href="{% url 'genero:crimen' %}">Crimen</a></li>
                <li id="m4"><a class="nav-link" href="{% url 'genero:comedia' %}">Comedia</a></li>
                <li id="m5"><a href="{% url 'genero:romance' %}">Romance</a></li>
                <li id="m6"><a href="{% url 'genero:suspenso' %}">Suspenso</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; Creado por: Marian Paraguan y Jessica Pacheco - 2026</p>
    </footer>
</body>
</html>
