{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container my-4">
    <h2 class="text-center text-danger fw-bold mb-4 bg-dark py-2 rounded">Género: {{ genero }}</h2>

    <div class="row row-cols-1 row-cols-lg-2 g-4">
        {% for peli in peliculas %}
        <div class="col">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">
                <div class="row g-0 h-100 align-items-center">
                    <div class="col-4 col-sm-3 col-md-4">
                        <img src="{% static peli.imagen %}" class="img-fluid rounded-start w-100" alt="{{ peli.nombre }}" style="height: 220px; object-fit: cover;">
                    </div>
                    <div class="col-8 col-sm-9 col-md-8">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-danger mb-1">{{ peli.nombre }}</h5>
                            <p class="card-text mb-2">
                                <span class="badge bg-dark">Año: {{ peli.anio }}</span>
                            </p>
                            <p class="card-text text-muted small">{{ peli.descripcion }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
